# Runs the submission pipeline's tests whenever it changes.
name: Working paper pipeline tests
on:
  push:
    paths: ["tools/**", ".github/workflows/wp-*.yml"]
  pull_request:
    paths: ["tools/**", ".github/workflows/wp-*.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pytest
      - run: python3 -m pytest -q tools/wp/tests
