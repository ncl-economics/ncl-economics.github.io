# Posts (and keeps updated) a preview of the RePEc record under each submission issue.
name: Working paper preview
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
  issues: write
concurrency:
  group: wp-preview-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: >-
      (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[WP]')) &&
      !contains(github.event.issue.labels.*.name, 'published')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the preview
        env:
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: python3 tools/wp/cli.py preview --issue-json-env ISSUE_JSON --out wp-preview.md
      - name: Label the issue as a submission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --add-label submission
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate \
               --jq '.[] | select(.body | startswith("<!-- wp-preview -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@wp-preview.md > /dev/null
          else
            gh issue comment "$NUMBER" --repo "$REPO" --body-file wp-preview.md
          fi
