# Publishes a submission once the editor adds the "approved" label or comments "/approve".
name: Working paper publish
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: wp-publish
jobs:
  publish:
    if: >-
      (contains(github.event.issue.labels.*.name, 'submission') || startsWith(github.event.issue.title, '[WP]')) &&
      !contains(github.event.issue.labels.*.name, 'published') &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'approved') ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve') &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ github.event.issue.number }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the cover-page tools
        run: |
          pip install --quiet pypdf playwright
          playwright install --with-deps chromium
      - name: Fetch the current issue
        run: gh api "repos/$REPO/issues/$NUMBER" > issue.json
      - name: Build the RePEc record, the PDF with cover, and the e-mail
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/wp/cli.py publish --issue-json issue.json --result wp-result.json --email wp-email.txt
      - name: Commit and push to the archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RePEc papers
          git commit -m "Add working paper ${{ steps.publish.outputs.number }}: ${{ steps.publish.outputs.title }}" \
                     -m "Published from #$NUMBER"
          git push origin HEAD:main
      - name: E-mail Marketing & Communication
        if: env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER || 'smtp.office365.com' }}
          server_port: ${{ secrets.MAIL_PORT || 587 }}
          secure: ${{ secrets.MAIL_PORT == '465' }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Newcastle Economics Discussion Papers <${{ secrets.MAIL_USERNAME }}>
          to: ${{ vars.MARKETING_EMAILS }}
          cc: ${{ vars.ADMIN_EMAIL }}
          subject: ${{ steps.publish.outputs.subject }}
          body: file://wp-email.txt
          attachments: papers/${{ steps.publish.outputs.number }}.pdf
      - name: Report on the issue and close it
        run: |
          {
            echo "<!-- wp-published -->"
            echo "Published as **${{ steps.publish.outputs.number }}** (handle \`RePEc:nwc:wpaper:${{ steps.publish.outputs.number }}\`)."
            echo
            echo "- PDF: ${{ steps.publish.outputs.pdf_url }}"
            echo "- IDEAS (live after the next mirroring run, 1-2 days): ${{ steps.publish.outputs.ideas_url }}"
            echo "- EconPapers: ${{ steps.publish.outputs.econpapers_url }}"
            echo
            if [ -n "$MAIL_USERNAME" ]; then
              echo "Marketing & Communication (${{ vars.MARKETING_EMAILS }}) have been e-mailed with the details and the PDF."
            else
              echo "E-mail is not configured, so please forward this to Marketing & Communication:"
              echo
              echo '```'
              echo "Subject: ${{ steps.publish.outputs.subject }}"
              echo
              cat wp-email.txt
              echo '```'
            fi
          } > wp-done.md
          gh label create published --repo "$REPO" --color 0E8A16 --description "Published on RePEc" --force
          gh issue edit "$NUMBER" --repo "$REPO" --add-label published --remove-label approved || true
          gh issue close "$NUMBER" --repo "$REPO" --comment "$(cat wp-done.md)"
      - name: Report a failure on the issue
        if: failure()
        run: |
          gh issue comment "$NUMBER" --repo "$REPO" --body "Publishing failed. See the log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix the issue fields if the log points at them, then remove and re-add the \`approved\` label (or comment \`/approve\` again)."
          gh issue edit "$NUMBER" --repo "$REPO" --remove-label approved || true
