# Render blueprint for the working paper portal (portal/).
# Deploy: https://render.com/deploy?repo=https://github.com/ncl-economics/ncl-economics.github.io
# Render reads this file from the repository's default branch.
services:
  - type: web
    name: ncl-wp-portal
    runtime: docker
    plan: starter            # the smallest plan that allows a persistent disk
    region: frankfurt
    dockerfilePath: ./portal/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    disk:
      name: portal-data
      mountPath: /srv/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /srv/data
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: GITHUB_REPO
        value: ncl-economics/ncl-economics.github.io
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        sync: false          # asked for when the blueprint is created
      - key: ADMIN_EMAIL
        sync: false
      - key: MARKETING_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUBMIT_CODE
        sync: false
      - key: SITE_URL
        value: https://ncl-economics.github.io
      - key: COVER_COMMAND
        value: python3 ../tools/make_cover.py {input} {output} --meta {meta}
