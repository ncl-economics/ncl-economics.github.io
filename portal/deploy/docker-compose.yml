# Self-hosted deployment on a Linux VM with Docker: the portal plus Caddy,
# which obtains and renews the HTTPS certificate automatically.
#
#   cp portal/.env.example portal/.env   # fill it in
#   echo "PORTAL_DOMAIN=wp-portal.example.ac.uk" > portal/deploy/.env
#   docker compose -f portal/deploy/docker-compose.yml up -d --build
#
# The VM needs ports 80 and 443 open and a DNS name pointing at it.
services:
  portal:
    build:
      context: ../..
      dockerfile: portal/Dockerfile
    env_file: ../.env
    environment:
      BASE_URL: https://${PORTAL_DOMAIN}
    volumes:
      - portal-data:/srv/data
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - portal

volumes:
  portal-data:
  caddy-data:
  caddy-config:
