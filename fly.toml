# Fly.io configuration for the working paper portal (portal/).
# First time:  fly launch --copy-config --no-deploy && fly volumes create portal_data --size 1 --region lhr
#              fly secrets set SECRET_KEY=... ADMIN_PASSWORD=... GITHUB_TOKEN=... SMTP_HOST=... SMTP_USER=... SMTP_PASSWORD=... MAIL_FROM=... ADMIN_EMAIL=... MARKETING_EMAILS=...
#              fly deploy
app = "ncl-wp-portal"
primary_region = "lhr"

[build]
  dockerfile = "portal/Dockerfile"

[env]
  DATA_DIR = "/srv/data"
  ADMIN_USER = "admin"
  GITHUB_REPO = "ncl-economics/ncl-economics.github.io"
  GITHUB_BRANCH = "main"
  SITE_URL = "https://ncl-economics.github.io"
  SMTP_PORT = "587"
  COVER_COMMAND = "python3 ../tools/make_cover.py {input} {output} --meta {meta}"

[mounts]
  source = "portal_data"
  destination = "/srv/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
